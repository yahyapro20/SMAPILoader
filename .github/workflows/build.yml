import struct
import os
import sys

# Fix Windows console encoding issues (حل مشکل ایموجی در ویندوز)
if sys.platform == 'win32':
    sys.stdout.reconfigure(encoding='utf-8')

try:
    import lz4.block
except ImportError:
    print("ERROR: pip install lz4")
    sys.exit(1)

COMPRESSED_DATA_MAGIC = b'XALZ'

def find_payload_section(data):
    if data[:4] != b'\x7fELF':
        raise ValueError("Not an ELF file")
    
    is64 = data[4] == 2
    if is64:
        e_shoff = struct.unpack_from('<Q', data, 0x28)[0]
        e_shentsize = struct.unpack_from('<H', data, 0x3A)[0]
        e_shnum = struct.unpack_from('<H', data, 0x3C)[0]
        e_shstrndx = struct.unpack_from('<H', data, 0x3E)[0]
    else:
        e_shoff = struct.unpack_from('<I', data, 0x20)[0]
        e_shentsize = struct.unpack_from('<H', data, 0x2E)[0]
        e_shnum = struct.unpack_from('<H', data, 0x30)[0]
        e_shstrndx = struct.unpack_from('<H', data, 0x32)[0]
        
    shstr_off_field = 0x18 if is64 else 0x10
    shstr_header_offset = e_shoff + (e_shentsize * e_shstrndx)
    shstr_offset = struct.unpack_from('<Q' if is64 else '<I', data, shstr_header_offset + shstr_off_field)[0]
    
    for i in range(e_shnum):
        sec_header = e_shoff + (e_shentsize * i)
        sh_name_offset = struct.unpack_from('<I', data, sec_header)[0]
        name_start = shstr_offset + sh_name_offset
        name_end = data.find(b'\x00', name_start)
        name = data[name_start:name_end].decode('utf-8', errors='ignore')
        
        if name == 'payload':
            sh_offset = struct.unpack_from('<Q' if is64 else '<I', data, sec_header + shstr_off_field)[0]
            sh_size = struct.unpack_from('<Q' if is64 else '<I', data, sec_header + (0x20 if is64 else 0x14))[0]
            return data[sh_offset:sh_offset+sh_size]
            
    raise ValueError("Section 'payload' not found in ELF")

def extract_maui_dlls(payload_data, out_dir):
    os.makedirs(out_dir, exist_ok=True)
    
    magic, version, entry_count, index_entry_count, index_size = struct.unpack_from('<5I', payload_data, 0)
    print(f"MAUI AssemblyStore - Version: {version}, Entries: {entry_count}, IndexSize: {index_size}")
    
    offset = 20 + index_size
    
    descriptors = []
    for _ in range(entry_count):
        desc = struct.unpack_from('<7I', payload_data, offset)
        descriptors.append(desc)
        offset += 28
        
    names = []
    for i in range(entry_count):
        if offset + 4 > len(payload_data):
            names.append(f"unknown_{i}")
            continue
        name_len = struct.unpack_from('<I', payload_data, offset)[0]
        offset += 4
        if offset + name_len > len(payload_data):
            names.append(f"unknown_{i}")
            continue
        name = payload_data[offset:offset+name_len].decode('utf-8', errors='ignore')
        names.append(name)
        offset += name_len
        
    needed = ["stardewvalley.dll", "stardewvalley.gamedata.dll", "monogame.framework.dll"]
    extracted_count = 0
    
    for i in range(entry_count):
        name = names[i]
        data_offset, data_size = descriptors[i][1], descriptors[i][2]
        
        if name.lower() not in needed:
            continue
            
        if not name.endswith('.dll'):
            name += '.dll'
            
        assembly_data = payload_data[data_offset:data_offset+data_size]
        
        if assembly_data.startswith(COMPRESSED_DATA_MAGIC):
            uncompressed_size = struct.unpack_from('<I', assembly_data, 8)[0]
            assembly_data = lz4.block.decompress(assembly_data[12:], uncompressed_size=uncompressed_size)
            
        out_path = os.path.join(out_dir, name)
        with open(out_path, 'wb') as f:
            f.write(assembly_data)
        print(f"[OK] Extracted: {name} ({len(assembly_data)} bytes)")
        extracted_count += 1
        
    return extracted_count

def main():
    blob_path = sys.argv[1]
    out_dir = sys.argv[2] if len(sys.argv) > 2 else "DependenciesDll"
    
    with open(blob_path, 'rb') as f:
        so_data = f.read()
        
    print("[INFO] Finding 'payload' section in ELF...")
    try:
        payload = find_payload_section(so_data)
    except ValueError as e:
        print(f"ERROR: {e}")
        sys.exit(1)
        
    print(f"[INFO] Payload section found ({len(payload)} bytes). Extracting DLLs...")
    count = extract_maui_dlls(payload, out_dir)
    
    print(f"\n[SUCCESS] {count} targeted DLLs extracted into '{out_dir}'")

if __name__ == "__main__":
    main()
