name: Build SMAPI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Game APK
        shell: pwsh
        run: |
          $url = "https://www.dl.farsroid.com/game/Stardew-Valley-1.6.15.3-Mod%28www.FarsRoid.com%29.apk"
          Write-Host "Downloading Stardew Valley APK..."
          Invoke-WebRequest -Uri $url -OutFile "game.apk" -UseBasicParsing -Headers @{
            "User-Agent" = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          }
          $size = (Get-Item "game.apk").Length
          Write-Host "Downloaded: $([math]::Round($size/1MB, 2)) MB"

      - name: Extract APK
        shell: pwsh
        run: |
          Expand-Archive -Path "game.apk" -DestinationPath "apk_contents" -Force
          $blob = "apk_contents\lib\arm64-v8a\libassemblies.arm64-v8a.blob.so"
          if (!(Test-Path $blob)) { Write-Host "ERROR: blob not found!"; exit 1 }
          Write-Host "Blob: $([math]::Round((Get-Item $blob).Length/1MB, 2)) MB"

      - name: Install Python LZ4
        run: pip install lz4

      - name: Extract Game DLLs
        shell: pwsh
        run: |
          $script = @'
          import struct, os, sys

          def parse_elf_payload(filepath):
              with open(filepath, 'rb') as f:
                  elf = f.read()
              if elf[:4] != b'\x7fELF':
                  raise ValueError("Not ELF")
              is64 = elf[4] == 2
              if is64:
                  e_shoff = struct.unpack_from('<Q', elf, 40)[0]
                  e_shentsize = struct.unpack_from('<H', elf, 58)[0]
                  e_shnum = struct.unpack_from('<H', elf, 60)[0]
                  e_shstrndx = struct.unpack_from('<H', elf, 62)[0]
              else:
                  e_shoff = struct.unpack_from('<I', elf, 32)[0]
                  e_shentsize = struct.unpack_from('<H', elf, 46)[0]
                  e_shnum = struct.unpack_from('<H', elf, 48)[0]
                  e_shstrndx = struct.unpack_from('<H', elf, 50)[0]
              sections = []
              for i in range(e_shnum):
                  b = e_shoff + i * e_shentsize
                  nm = struct.unpack_from('<I', elf, b)[0]
                  if is64:
                      off = struct.unpack_from('<Q', elf, b+24)[0]
                      sz = struct.unpack_from('<Q', elf, b+32)[0]
                  else:
                      off = struct.unpack_from('<I', elf, b+16)[0]
                      sz = struct.unpack_from('<I', elf, b+20)[0]
                  sections.append((nm, off, sz))
              st_off = sections[e_shstrndx][1]
              st_sz = sections[e_shstrndx][2]
              strtab = elf[st_off:st_off+st_sz]
              for nm_i, off, sz in sections:
                  end = strtab.index(b'\x00', nm_i)
                  name = strtab[nm_i:end].decode('ascii')
                  if name == 'payload':
                      return elf[off:off+sz]
              raise ValueError("no payload section")

          so_path = sys.argv[1]
          out_dir = sys.argv[2]
          needed = ["StardewValley.dll", "StardewValley.GameData.dll", "MonoGame.Framework.dll"]
          os.makedirs(out_dir, exist_ok=True)

          print("[1] ELF payload extraction...")
          P = parse_elf_payload(so_path)
          print(f"    Payload: {len(P)} bytes")

          magic, raw_ver, local_cnt, global_cnt, idx_bytes = struct.unpack_from('<5I', P, 0)
          ver = raw_ver & 0xFF
          print(f"[2] XABA: magic=0x{magic:08X} ver={ver} local={local_cnt} global={global_cnt} idx_bytes={idx_bytes}")
          if magic != 0x41424158:
              print("FATAL: bad magic"); sys.exit(1)

          off = 20

          if ver >= 2:
              idx_total = global_cnt * 12
              print(f"[3] Skipping global index: {idx_total} bytes")
              off += idx_total

          entry_sz = 28 if ver >= 2 else 24
          entries = []
          for i in range(local_cnt):
              if ver >= 2:
                  f = struct.unpack_from('<7I', P, off)
                  entries.append((f[1], f[2]))
              else:
                  f = struct.unpack_from('<6I', P, off)
                  entries.append((f[0], f[1]))
              off += entry_sz
          print(f"[4] Read {local_cnt} entries, offset={off}")

          names = []
          for i in range(local_cnt):
              nlen = struct.unpack_from('<I', P, off)[0]
              off += 4
              if 0 < nlen < 512:
                  nm = P[off:off+nlen].decode('utf-8')
                  off += nlen
                  names.append(nm)
              else:
                  names.append(f"__unknown_{i}__")
          print(f"[5] Read {len(names)} names, offset={off}")

          print(f"\n=== ALL {local_cnt} ASSEMBLIES ===")
          for i in range(local_cnt):
              d, s = entries[i]
              tag = " ***" if (names[i] if names[i].endswith('.dll') else names[i]+'.dll') in needed else ""
              print(f"  [{i:2d}] {names[i]:50s} off={d:8d} sz={s:8d}{tag}")

          print(f"\n=== EXTRACTING ===")
          found = []
          for i, nm in enumerate(names):
              dll = nm if nm.endswith('.dll') else nm + '.dll'
              if dll in needed:
                  doff, dsz = entries[i]
                  raw = P[doff:doff+dsz]
                  if len(raw) >= 12 and raw[:4] == b'XALZ':
                      import lz4.block
                      usz = struct.unpack_from('<I', raw, 8)[0]
                      raw = lz4.block.decompress(raw[12:], uncompressed_size=usz)
                      print(f"  {dll}: XALZ decompressed -> {len(raw)} bytes")
                  mz = raw[:2] == b'MZ' if len(raw) >= 2 else False
                  print(f"  {dll}: {len(raw)} bytes [{'MZ-OK' if mz else 'NO-MZ: '+raw[:8].hex() if raw else 'EMPTY'}]")
                  with open(os.path.join(out_dir, dll), 'wb') as fo:
                      fo.write(raw)
                  found.append(dll)

          print(f"\n=== RESULT: {len(found)}/{len(needed)} ===")
          ok = True
          for n in needed:
              p = os.path.join(out_dir, n)
              if os.path.exists(p) and os.path.getsize(p) > 100:
                  print(f"  OK   {n} ({os.path.getsize(p):,} bytes)")
              else:
                  print(f"  FAIL {n}")
                  ok = False
          if not ok:
              sys.exit(1)
          print("\nSUCCESS!")
          '@
          $script | Set-Content "extract_dlls.py" -Encoding UTF8
          python extract_dlls.py "apk_contents/lib/arm64-v8a/libassemblies.arm64-v8a.blob.so" "DependenciesDll"

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android Workload
        run: dotnet workload install android

      - name: Install Custom Mono Runtime
        shell: pwsh
        run: |
          $packDir = Get-ChildItem "$env:DOTNET_ROOT\packs\Microsoft.NETCore.App.Runtime.Mono.android-arm64" | Select-Object -First 1
          $target = Join-Path $packDir.FullName "runtimes\android-arm64\native\libmonosgen-2.0.so"
          Copy-Item "SharedLibs\native\arm64-v8a\libmonosgen-2.0.so" $target -Force
          Write-Host "Mono runtime replaced."

      - name: Prepare Dependencies
        shell: pwsh
        run: |
          $d = "..\SMAPI-Android-1.6\src\DependenciesDll"
          New-Item -ItemType Directory -Path $d -Force | Out-Null
          Copy-Item "DependenciesDll\*.dll" $d -Force
          Get-ChildItem $d | ForEach-Object { Write-Host "$($_.Name) = $([math]::Round($_.Length/1MB,2)) MB" }

      - name: Build APK
        run: dotnet build SMAPIGameLoader/SMAPIGameLoader.csproj -c Release

      - name: Cleanup large files
        shell: pwsh
        run: |
          Remove-Item "game.apk" -Force -ErrorAction SilentlyContinue
          Remove-Item "apk_contents" -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "Cleaned. Remaining APKs:"
          Get-ChildItem -Recurse -Filter "*.apk" -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "  $($_.FullName) ($([math]::Round($_.Length/1MB,2)) MB)"
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SMAPI-Loader-APK
          path: 'SMAPIGameLoader/bin/**/*.apk'
